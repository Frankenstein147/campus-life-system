<!DOCTYPE html>
<html lang="zh-CN" data-role="student">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>门禁出行 - 校园生活系统</title>
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<style>
  .pass-card { background: var(--accent-grad); border-radius: var(--radius-md); padding: 24px; color: #fff; position: relative; overflow: hidden; }
  .pass-card::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,.15) 1px, transparent 1px); background-size: 24px 24px; opacity: .4; }
  .pass-card > * { position: relative; }
  .pass-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .pass-row:last-child { border-bottom: none; }
  .pass-icon { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pass-icon.in { background: var(--success-soft); color: var(--success); }
  .pass-icon.out { background: var(--info-soft); color: var(--info); }
  .gate-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; text-align: center; transition: var(--dur); }
  .gate-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .gate-icon { width: 44px; height: 44px; border-radius: var(--radius); background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
  .qr-box { background: var(--card); border: 2px solid var(--accent); border-radius: var(--radius-md); padding: 20px; text-align: center; }
  .qr-mock { width: 160px; height: 160px; margin: 0 auto 12px; background: var(--muted); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .qr-mock::before { content: ""; position: absolute; inset: 12px; background-image: linear-gradient(45deg, var(--fg) 25%, transparent 25%), linear-gradient(-45deg, var(--fg) 25%, transparent 25%), linear-gradient(45deg, transparent 75%, var(--fg) 75%), linear-gradient(-45deg, transparent 75%, var(--fg) 75%); background-size: 12px 12px; background-position: 0 0, 0 6px, 6px -6px, -6px 0; opacity: .15; }
  .qr-corner { position: absolute; width: 24px; height: 24px; border: 3px solid var(--accent); }
  .qr-corner.tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
  .qr-corner.tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
  .qr-corner.bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
  .qr-corner.br { bottom: 8px; right: 8px; border-left: none; border-top: none; }
</style>
</head>
<body>
<script src="../assets/js/mock.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const nav = [
    { title: "主导航", items: [
      { key: "home", label: "概览", icon: "grid", href: "index.html" },
      { key: "dorm", label: "宿舍管理", icon: "home", href: "dorm.html" },
      { key: "dining", label: "餐饮服务", icon: "utensils", href: "dining.html" },
      { key: "repair", label: "后勤报修", icon: "wrench", href: "repair.html", badge: "2" },
      { key: "access", label: "门禁出行", icon: "door", href: "access.html" },
      { key: "social", label: "校园社交", icon: "chat", href: "social.html" }
    ]}
  ];
  const main = CAMPUS.shell.render({ role: "student", nav, title: "门禁出行 · 学生端", active: "access" });
  const a = CAMPUS.mock.access;
  const p = CAMPUS.mock.accessPass;

  main.innerHTML =
    CAMPUS.shell.pageHead([{ label: "学生端", href: "index.html" }, { label: "门禁出行" }], "门禁出行", "校园通行码、出入记录与异常提醒",
      '<button class="btn btn-outline btn-sm" onclick="CAMPUS.toast(\'出行记录已导出\',\'success\')">' + CAMPUS.icon("download", "icon-sm") + " 导出记录</button>") +

    '<section class="grid grid-3 mb-4">' +
      '<div class="pass-card"><div style="font-size:12px;opacity:.85">本月通行</div><div style="font-family:var(--font-display);font-size:2.5rem;font-weight:800;margin:4px 0">' + p.total + '</div><div style="font-size:12px;opacity:.85">正常 ' + p.normal + " · 异常 " + p.abnormal + "</div></div>" +
      '<div class="stat-card"><div class="stat-icon">' + CAMPUS.icon("door") + '</div><p class="stat-label">最近通行</p><p class="stat-value" style="font-size:1.2rem">' + p.lastGate + "</p><span class=\"stat-trend text-muted\" style=\"color:var(--fg-muted)\">" + p.lastTime.slice(11) + " 入校</span></div>" +
      '<div class="qr-box"><div style="font-weight:700;margin-bottom:4px">校园通行码</div><div class="text-muted" style="font-size:11px;margin-bottom:12px">点击二维码刷新</div>' +
        '<div class="qr-mock" onclick="CAMPUS.toast(\'通行码已刷新\',\'success\')"><div class="qr-corner tl"></div><div class="qr-corner tr"></div><div class="qr-corner bl"></div><div class="qr-corner br"></div><div style="position:relative;color:var(--accent);font-weight:700;font-size:11px;text-align:center">动态码<br>30s 刷新</div></div>' +
        '<div class="text-muted" style="font-size:11px">陈思远 · S2024001</div>' +
      "</div>" +
    "</section>" +

    '<section class="grid grid-4 mb-4">' +
      '<div class="gate-card"><div class="gate-icon">' + CAMPUS.icon("door") + '</div><div style="font-weight:600;font-size:13px">南校门</div><div class="text-muted" style="font-size:11px">24h 通行</div></div>' +
      '<div class="gate-card"><div class="gate-icon">' + CAMPUS.icon("door") + '</div><div style="font-weight:600;font-size:13px">东校门</div><div class="text-muted" style="font-size:11px">06:00-23:00</div></div>' +
      '<div class="gate-card"><div class="gate-icon">' + CAMPUS.icon("door") + '</div><div style="font-weight:600;font-size:13px">北校门</div><div class="text-muted" style="font-size:11px">24h 通行</div></div>' +
      '<div class="gate-card"><div class="gate-icon">' + CAMPUS.icon("door") + '</div><div style="font-weight:600;font-size:13px">西校门</div><div class="text-muted" style="font-size:11px">06:00-22:00</div></div>' +
    "</section>" +

    '<section class="card"><div class="flex items-center justify-between mb-3"><h3 style="margin:0">通行记录</h3><div class="flex gap-2"><button class="btn btn-ghost btn-sm">' + CAMPUS.icon("filter", "icon-sm") + " 筛选</button><button class=\"btn btn-ghost btn-sm\">" + CAMPUS.icon("calendar", "icon-sm") + " 本月</button></div></div>" +
      a.map(r =>
        '<div class="pass-row"><div class="pass-icon ' + (r.direction === "入校" ? "in" : "out") + '">' + CAMPUS.icon(r.direction === "入校" ? "arrowDown" : "arrowUp", "icon") + '</div>' +
        '<div style="flex:1"><div style="font-weight:600;font-size:13px">' + r.gate + " · " + r.direction + '</div><div class="text-muted" style="font-size:11px">' + r.method + " · " + r.id + "</div></div>" +
        '<div style="text-align:right"><div class="text-muted" style="font-size:12px">' + r.time.slice(11) + "</div>" + CAMPUS.shell.statusTag(r.status) + "</div></div>"
      ).join("") +
    "</section>";

  main.querySelectorAll("section").forEach((s, i) => { s.classList.add("fade-up"); s.style.animationDelay = (i * 0.05) + "s"; });
</script>
</body>
</html>
