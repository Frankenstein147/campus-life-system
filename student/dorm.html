<!DOCTYPE html>
<html lang="zh-CN" data-role="student">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宿舍管理 - 校园生活系统</title>
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<style>
  .room-visual { background: var(--accent-grad); border-radius: var(--radius-md); padding: 24px; color: #fff; position: relative; overflow: hidden; }
  .room-visual::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,.15) 1px, transparent 1px); background-size: 24px 24px; opacity: .4; }
  .room-visual > * { position: relative; }
  .room-no { font-family: var(--font-display); font-size: 2.5rem; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .room-meta { display: flex; gap: 20px; margin-top: 12px; font-size: 13px; opacity: .9; }
  .room-meta-item { display: flex; align-items: center; gap: 6px; }
  .bed-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .bed-card { background: var(--muted); border-radius: var(--radius); padding: 12px; display: flex; align-items: center; gap: 10px; }
  .bed-card.me { background: var(--accent-soft); border: 1px solid var(--accent); }
  .bed-no { width: 28px; height: 28px; border-radius: 50%; background: var(--card); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; flex-shrink: 0; }
  .bed-card.me .bed-no { background: var(--accent); color: #fff; }
  .util-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .util-bar-label { width: 80px; font-size: 12px; color: var(--fg-muted); }
  .util-bar-track { flex: 1; height: 8px; background: var(--muted); border-radius: 4px; overflow: hidden; }
  .util-bar-fill { height: 100%; background: var(--accent-grad); border-radius: 4px; }
  .util-bar-val { width: 60px; text-align: right; font-size: 12px; font-weight: 600; }
</style>
</head>
<body>
<script src="../assets/js/mock.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const nav = [
    { title: "主导航", items: [
      { key: "home", label: "概览", icon: "grid", href: "index.html" },
      { key: "dorm", label: "宿舍管理", icon: "home", href: "dorm.html" },
      { key: "dining", label: "餐饮服务", icon: "utensils", href: "dining.html" },
      { key: "repair", label: "后勤报修", icon: "wrench", href: "repair.html", badge: "2" },
      { key: "access", label: "门禁出行", icon: "door", href: "access.html" },
      { key: "social", label: "校园社交", icon: "chat", href: "social.html" }
    ]}
  ];
  const main = CAMPUS.shell.render({ role: "student", nav, title: "宿舍管理 · 学生端", active: "dorm" });
  const d = CAMPUS.mock.dorm;

  const maxE = Math.max(...d.utilities.map(u => u.electric));
  const maxW = Math.max(...d.utilities.map(u => u.water));

  main.innerHTML =
    CAMPUS.shell.pageHead([{ label: "学生端", href: "index.html" }, { label: "宿舍管理" }], "宿舍管理", "查看宿舍信息、室友、水电费及卫生检查记录",
      '<a class="btn btn-primary btn-sm" href="repair.html">' + CAMPUS.icon("plus", "icon-sm") + " 报修</a>") +

    '<section class="grid grid-2 mb-4">' +
      '<div class="room-visual">' +
        '<div style="font-size:12px;opacity:.8;margin-bottom:4px">当前住宿</div>' +
        '<h2 class="room-no">' + d.info.building + " " + d.info.room + "</h2>" +
        '<div class="room-meta">' +
          '<div class="room-meta-item">' + CAMPUS.icon("building", "icon-sm") + d.info.type + "</div>" +
          '<div class="room-meta-item">' + CAMPUS.icon("grid", "icon-sm") + d.info.area + "</div>" +
          '<div class="room-meta-item">' + CAMPUS.icon("users", "icon-sm") + d.info.used + "/" + d.info.beds + " 床位</div>" +
          '<div class="room-meta-item">' + CAMPUS.icon("layers", "icon-sm") + d.info.floor + "F</div>" +
        "</div>" +
      "</div>" +
      '<div class="card"><h3 style="margin-top:0">室友信息</h3><div class="bed-grid">' +
        d.roommates.map(r =>
          '<div class="bed-card' + (r.isMe ? " me" : "") + '"><div class="bed-no">' + r.bed.charAt(0) + '</div><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13px">' + r.name + (r.isMe ? ' <span class="tag tag-accent" style="font-size:9px">我</span>' : "") + '</div><div class="text-muted" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + r.dept + "</div></div></div>"
        ).join("") +
      "</div></div>" +
    "</section>" +

    '<section class="grid grid-2 mb-4">' +
      '<div class="card"><div class="flex items-center justify-between mb-3"><h3 style="margin:0">水电费趋势</h3><span class="text-muted" style="font-size:11px">近 4 个月</span></div>' +
        d.utilities.map(u => {
          const ePct = Math.round(u.electric / maxE * 100);
          const wPct = Math.round(u.water / maxW * 100);
          return '<div style="margin-bottom:14px"><div class="flex items-center justify-between mb-2"><div style="font-weight:600;font-size:13px">' + u.month.slice(5) + ' 月</div><div class="text-accent" style="font-weight:700">¥' + u.total.toFixed(2) + "</div></div>" +
            '<div class="util-bar"><div class="util-bar-label">电费</div><div class="util-bar-track"><div class="util-bar-fill" style="width:' + ePct + '%"></div></div><div class="util-bar-val">¥' + u.electric.toFixed(1) + "</div></div>" +
            '<div class="util-bar"><div class="util-bar-label">水费</div><div class="util-bar-track"><div class="util-bar-fill" style="width:' + wPct + '%;background:linear-gradient(135deg,#0EA5E9,#38BDF8)"></div></div><div class="util-bar-val">¥' + u.water.toFixed(1) + "</div></div>" +
          "</div>";
        }).join("") +
      "</div>" +

      '<div class="card"><h3 style="margin-top:0">卫生检查记录</h3>' +
        '<div class="timeline">' + d.inspections.map(i =>
          '<div class="timeline-item"><div class="timeline-dot"></div>' +
            '<div class="timeline-time">' + i.date + " · " + i.inspector + "</div>" +
            '<div class="timeline-title">' + i.items + ' <span class="tag tag-' + (i.score >= 90 ? "success" : "info") + '" style="margin-left:6px">' + i.result + "</span></div>" +
            '<div class="timeline-desc">综合评分 <strong style="color:var(--fg)">' + i.score + "</strong> / 100</div>" +
          "</div>"
        ).join("") + "</div>" +
      "</div>" +
    "</section>" +

    '<section class="card"><div class="flex items-center justify-between mb-3"><h3 style="margin:0">水电费明细</h3><button class="btn btn-outline btn-sm" onclick="CAMPUS.toast(\'账单已导出至校园邮箱\',\'success\')">' + CAMPUS.icon("download", "icon-sm") + " 导出账单</button></div>" +
      '<div style="overflow-x:auto"><table class="table"><thead><tr><th>账期</th><th>电费</th><th>水费</th><th>合计</th><th>状态</th><th>操作</th></tr></thead><tbody>' +
        d.utilities.map(u => "<tr><td><strong>" + u.month + "</strong></td><td>¥" + u.electric.toFixed(2) + "</td><td>¥" + u.water.toFixed(2) + "</td><td><strong>¥" + u.total.toFixed(2) + "</strong></td><td>" + CAMPUS.shell.statusTag(u.status) + '</td><td><button class="btn btn-ghost btn-sm" onclick="CAMPUS.toast(\'账单详情已打开\')">查看</button></td></tr>').join("") +
      "</tbody></table></div>" +
    "</section>";

  main.querySelectorAll("section").forEach((s, i) => { s.classList.add("fade-up"); s.style.animationDelay = (i * 0.05) + "s"; });
</script>
</body>
</html>
