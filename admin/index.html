<!DOCTYPE html>
<html lang="zh-CN" data-role="admin">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员端 · 概览 - 校园生活系统</title>
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<style>
  .health-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .health-label { font-size: 11px; color: var(--fg-muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .health-bar { height: 6px; background: var(--muted); border-radius: 3px; overflow: hidden; }
  .health-fill { height: 100%; border-radius: 3px; transition: width .6s var(--ease); }
  .chart-bar { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding: 12px 0; }
  .chart-col { flex: 1; background: var(--accent-grad); border-radius: 4px 4px 0 0; transition: var(--dur); position: relative; min-height: 4px; }
  .chart-col:hover { opacity: .8; }
  .chart-col:hover::after { content: attr(data-val); position: absolute; top: -22px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--card); padding: 2px 6px; border-radius: 4px; font-size: 10px; white-space: nowrap; }
  .chart-labels { display: flex; gap: 6px; font-size: 10px; color: var(--fg-muted); }
  .chart-labels span { flex: 1; text-align: center; }
  .log-row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 12px; font-family: var(--font-mono); }
  .log-row:last-child { border-bottom: none; }
  .log-time { color: var(--fg-subtle); flex-shrink: 0; }
  .log-level { padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .log-INFO { background: var(--info-soft); color: var(--info); }
  .log-WARN { background: var(--warning-soft); color: var(--warning); }
  .log-ERROR { background: var(--danger-soft); color: var(--danger); }
  .log-msg { color: var(--fg); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<script src="../assets/js/mock.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const nav = [
    { title: "运维管理", items: [
      { key: "home", label: "概览", icon: "grid", href: "index.html" },
      { key: "users", label: "用户管理", icon: "users", href: "users.html" },
      { key: "tickets", label: "工单运维", icon: "ticket", href: "tickets.html", badge: "37" },
      { key: "finance", label: "财务对账", icon: "wallet", href: "finance.html" },
      { key: "analytics", label: "数据统计分析", icon: "chart", href: "analytics.html" },
      { key: "maintenance", label: "系统维护", icon: "settings", href: "maintenance.html" },
      { key: "extensions", label: "拓展增值", icon: "plug", href: "extensions.html" }
    ]}
  ];
  const main = CAMPUS.shell.render({ role: "admin", nav, title: "概览 · 管理员端", active: "home" });
  const stats = CAMPUS.mock.stats.admin;
  const sys = CAMPUS.mock.admin.system;
  const an = CAMPUS.mock.admin.analytics;
  const tickets = CAMPUS.mock.admin.tickets.filter(t => t.status !== "已完成");

  const months = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  const maxU = Math.max(...an.userTrend);
  const chartBars = an.userTrend.map((v, i) => '<div class="chart-col" style="height:' + Math.round(v / maxU * 100) + '%" data-val="' + v.toLocaleString() + '"></div>').join("");

  function healthItem(label, val, color) {
    return '<div class="health-card"><div class="health-label"><span>' + label + '</span><strong>' + val + '%</strong></div><div class="health-bar"><div class="health-fill" style="width:' + val + '%;background:' + color + '"></div></div></div>';
  }

  main.innerHTML =
    CAMPUS.shell.pageHead([{ label: "管理员端", href: "index.html" }, { label: "概览" }], "系统运维概览", new Date().toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric", weekday: "long" }) + " · 系统运行正常",
      '<button class="btn btn-outline btn-sm" onclick="CAMPUS.toast(\'数据已刷新\',\'success\')">' + CAMPUS.icon("refresh", "icon-sm") + " 刷新数据</button>") +

    '<section class="grid grid-4 mb-4">' + stats.map(CAMPUS.shell.statCard).join("") + "</section>" +

    '<section class="grid grid-2 mb-4">' +
      '<div class="card"><div class="flex items-center justify-between mb-3"><h3 style="margin:0">用户增长趋势</h3><span class="text-muted" style="font-size:12px">近 12 个月</span></div>' +
        '<div class="chart-bar">' + chartBars + "</div>" +
        '<div class="chart-labels">' + months.map(m => "<span>" + m + "</span>").join("") + "</div>" +
        '<div class="flex items-center justify-between mt-3" style="font-size:12px"><span class="text-muted">今日活跃 <strong style="color:var(--accent)">' + an.activeToday.toLocaleString() + '</strong></span><span class="text-muted">峰值时段 <strong style="color:var(--fg)">' + an.peakHour + "</strong></span></div>" +
      "</div>" +

      '<div class="card"><h3 style="margin-top:0">系统健康度</h3>' +
        '<div class="grid grid-2 gap-2 mb-3">' +
          healthItem("CPU", sys.health.cpu, "var(--accent)") +
          healthItem("内存", sys.health.memory, "var(--info)") +
          healthItem("磁盘", sys.health.disk, "var(--success)") +
          healthItem("网络", sys.health.network, "var(--warning)") +
        "</div>" +
        '<div class="flex items-center justify-between" style="background:var(--muted);border-radius:var(--radius);padding:12px;font-size:12px"><span class="text-muted">系统可用率</span><strong style="color:var(--success);font-size:16px;font-family:var(--font-display)">' + sys.health.uptime + '</strong></div>' +
        '<div class="flex items-center justify-between mt-2" style="font-size:12px"><span class="text-muted">当前 QPS</span><strong style="color:var(--fg)">' + sys.health.qps.toLocaleString() + '</strong></div>' +
      "</div>" +
    "</section>" +

    '<section class="grid grid-2 mb-4">' +
      '<div class="card"><div class="flex items-center justify-between mb-3"><h3 style="margin:0">待处理工单</h3><a class="text-accent" href="tickets.html" style="font-size:12px">工单中心 →</a></div>' +
        (tickets.length ? tickets.slice(0, 4).map(t =>
          '<div class="flex items-center justify-between" style="padding:10px 0;border-bottom:1px solid var(--border)"><div style="flex:1"><div style="font-weight:600;font-size:13px">' + t.title + '</div><div class="text-muted" style="font-size:11px">' + t.id + " · " + t.requester + " · " + t.created.slice(5, 16) + "</div></div>" +
          '<div style="text-align:right">' + (t.priority === "紧急" ? '<span class="tag tag-danger">紧急</span>' : '<span class="tag tag-info">普通</span>') + " " + CAMPUS.shell.statusTag(t.status) + "</div></div>"
        ).join("") : CAMPUS.shell.empty("暂无待处理工单")) +
      "</div>" +

      '<div class="card"><div class="flex items-center justify-between mb-3"><h3 style="margin:0">实时日志</h3><span class="tag tag-success tag-dot">实时</span></div>' +
        sys.logs.map(l =>
          '<div class="log-row"><span class="log-time">' + l.time + '</span><span class="log-level log-' + l.level + '">' + l.level + '</span><span class="log-msg">' + l.msg + "</span></div>"
        ).join("") +
        '<button class="btn btn-ghost btn-sm btn-block mt-2" onclick="CAMPUS.toast(\'完整日志已打开\')">查看全部日志</button>' +
      "</div>" +
    "</section>" +

    '<section class="card"><div class="flex items-center justify-between mb-3"><h3 style="margin:0">服务状态</h3><span class="text-muted" style="font-size:12px">' + sys.services.length + " 个服务</span></div>" +
      '<div class="grid grid-auto">' + sys.services.map(s =>
        '<div class="card" style="padding:14px"><div class="flex items-center justify-between mb-2"><div style="font-weight:600;font-size:13px">' + s.name + "</div>" + CAMPUS.shell.statusTag(s.status) + "</div>" +
        '<div class="flex items-center justify-between" style="font-size:11px;color:var(--fg-muted)"><span>' + CAMPUS.icon("activity", "icon-sm") + " " + s.latency + '</span><span>' + CAMPUS.icon("check", "icon-sm") + " " + s.uptime + "</span></div></div>"
      ).join("") + "</div>" +
    "</section>";

  main.querySelectorAll("section").forEach((s, i) => { s.classList.add("fade-up"); s.style.animationDelay = (i * 0.05) + "s"; });
</script>
</body>
</html>
