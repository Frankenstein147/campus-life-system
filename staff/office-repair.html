<!DOCTYPE html>
<html lang="zh-CN" data-role="staff">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>办公报修 - 校园生活系统</title>
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<style>
  .repair-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px; transition: var(--dur); }
  .repair-card:hover { box-shadow: var(--shadow-md); }
  .progress-steps { display: flex; gap: 4px; margin-top: 12px; }
  .progress-step { flex: 1; height: 4px; background: var(--muted); border-radius: 2px; }
  .progress-step.done { background: var(--accent); }
  .progress-step.active { background: var(--accent-grad); }
  .progress-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--fg-subtle); }
</style>
</head>
<body>
<script src="../assets/js/mock.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  const nav = [
    { title: "办公导航", items: [
      { key: "home", label: "概览", icon: "grid", href: "index.html" },
      { key: "attend", label: "考勤打卡", icon: "clock", href: "attendance.html" },
      { key: "notice", label: "通知下发", icon: "bell", href: "notice.html" },
      { key: "repair", label: "办公报修", icon: "wrench", href: "office-repair.html", badge: "1" },
      { key: "resource", label: "场地物资借用", icon: "box", href: "resource.html" }
    ]}
  ];
  const main = CAMPUS.shell.render({ role: "staff", nav, title: "办公报修 · 教职工端", active: "repair" });
  const repairs = CAMPUS.mock.staff.officeRepairs;
  const steps = ["提交", "派工", "处理中", "已完成"];

  function progressHtml(r) {
    const idx = r.status === "已完成" ? 3 : (r.status === "处理中" ? 2 : 1);
    return '<div class="progress-steps">' + steps.map((s, i) => '<div class="progress-step ' + (i < idx ? "done" : (i === idx ? "active" : "")) + '"></div>').join("") + "</div>" +
      '<div class="progress-labels">' + steps.map(s => "<span>" + s + "</span>").join("") + "</div>";
  }

  main.innerHTML =
    CAMPUS.shell.pageHead([{ label: "教职工端", href: "index.html" }, { label: "办公报修" }], "办公报修", "办公室设施、教学设备、网络等报修工单管理",
      '<button class="btn btn-primary btn-sm" id="newRepairBtn">' + CAMPUS.icon("plus", "icon-sm") + " 发起报修</button>") +

    '<section class="grid grid-4 mb-4">' +
      '<div class="stat-card"><div class="stat-icon">' + CAMPUS.icon("ticket") + '</div><p class="stat-label">全部工单</p><p class="stat-value">' + repairs.length + '</p></div>' +
      '<div class="stat-card"><div class="stat-icon" style="background:var(--info-soft);color:var(--info)">' + CAMPUS.icon("activity") + '</div><p class="stat-label">处理中</p><p class="stat-value">' + repairs.filter(r => r.status === "处理中").length + '</p></div>' +
      '<div class="stat-card"><div class="stat-icon" style="background:var(--success-soft);color:var(--success)">' + CAMPUS.icon("check") + '</div><p class="stat-label">已完成</p><p class="stat-value">' + repairs.filter(r => r.status === "已完成").length + '</p></div>' +
      '<div class="stat-card"><div class="stat-icon" style="background:var(--warning-soft);color:var(--warning)">' + CAMPUS.icon("clock") + '</div><p class="stat-label">平均响应</p><p class="stat-value">2.4h</p></div>' +
    "</section>" +

    '<section class="grid grid-2">' + repairs.map(r =>
      '<div class="repair-card">' +
        '<div class="flex items-center justify-between mb-2"><span class="tag tag-accent">' + r.id + "</span>" + CAMPUS.shell.statusTag(r.status) + "</div>" +
        '<h3 style="margin:8px 0 4px;font-size:15px">' + r.title + "</h3>" +
        '<div class="text-muted" style="font-size:12px">' + CAMPUS.icon("map", "icon-sm") + " " + r.location + " · " + CAMPUS.icon("user", "icon-sm") + " " + r.handler + " · " + r.created + "</div>" +
        progressHtml(r) +
        '<div class="flex gap-2 mt-3"><button class="btn btn-ghost btn-sm" onclick="CAMPUS.toast(\'工单详情已打开\')">详情</button>' +
        (r.status === "已完成" ? '<button class="btn btn-outline btn-sm" onclick="CAMPUS.toast(\'感谢您的评价！\',\'success\')">评价</button>' : '<button class="btn btn-outline btn-sm" onclick="CAMPUS.toast(\'已催单\',\'warning\')">催单</button>') +
        "</div>" +
      "</div>"
    ).join("") + "</section>" +

    '<section class="card mt-4"><h3 style="margin-top:0">常见报修类型</h3>' +
      '<div class="grid grid-4">' +
        '<div class="template-card" onclick="CAMPUS.toast(\'已选择空调报修\')" style="padding:14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:var(--dur)"><div style="font-size:24px;margin-bottom:6px">❄️</div><div style="font-weight:600;font-size:13px">空调故障</div><div class="text-muted" style="font-size:11px">制冷/制热/异响</div></div>' +
        '<div class="template-card" onclick="CAMPUS.toast(\'已选择网络报修\')" style="padding:14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:var(--dur)"><div style="font-size:24px;margin-bottom:6px">📶</div><div style="font-weight:600;font-size:13px">网络故障</div><div class="text-muted" style="font-size:11px">无法连接/网速慢</div></div>' +
        '<div class="template-card" onclick="CAMPUS.toast(\'已选择投影仪报修\')" style="padding:14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:var(--dur)"><div style="font-size:24px;margin-bottom:6px">📽️</div><div style="font-weight:600;font-size:13px">投影设备</div><div class="text-muted" style="font-size:11px">显示/色彩/连接</div></div>' +
        '<div class="template-card" onclick="CAMPUS.toast(\'已选择其他报修\')" style="padding:14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:var(--dur)"><div style="font-size:24px;margin-bottom:6px">🔧</div><div style="font-weight:600;font-size:13px">其他设施</div><div class="text-muted" style="font-size:11px">门窗/水电/家具</div></div>' +
      "</div>" +
    "</section>";

  main.querySelectorAll("section").forEach((s, i) => { s.classList.add("fade-up"); s.style.animationDelay = (i * 0.05) + "s"; });

  document.getElementById("newRepairBtn").onclick = () => CAMPUS.modal({
    title: "发起办公报修",
    body:
      '<div class="field"><label class="field-label">报修类型</label><select class="select"><option>空调故障</option><option>网络故障</option><option>投影设备</option><option>水电问题</option><option>其他</option></select></div>' +
      '<div class="field"><label class="field-label">报修位置</label><input class="input" value="计算机楼 A-508"></div>' +
      '<div class="field"><label class="field-label">紧急程度</label><select class="select"><option>普通</option><option>紧急</option></select></div>' +
      '<div class="field"><label class="field-label">问题描述</label><textarea class="textarea" placeholder="请详细描述故障现象…"></textarea></div>' +
      '<div class="field"><label class="field-label">期望处理时间</label><input class="input" type="datetime-local"></div>',
    onOk: () => CAMPUS.toast("报修工单已提交", "success")
  });
</script>
</body>
</html>
